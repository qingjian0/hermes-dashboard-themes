name: "white"
label: "White"
description: "Clean white — bright and minimal"
palette:
  background: "#f8f9fa"
  midground: "#1e293b"
  foreground: "#ffffff"
  warmGlow: "rgba(99, 102, 241, 0.06)"
  noiseOpacity: 0
typography:
  fontSans: "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  fontMono: "ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0"
layout:
  radius: "0.5rem"
  density: comfortable
colorOverrides:
  card: "#ffffff"
  cardForeground: "#1e293b"
  popover: "#ffffff"
  popoverForeground: "#1e293b"
  muted: "#f1f3f5"
  mutedForeground: "#475569"
  accent: "#f0f4ff"
  accentForeground: "#4338ca"
  border: "#e2e8f0"
  input: "#cbd5e1"
  primary: "#6366f1"
  primaryForeground: "#ffffff"
  secondary: "#f8fafc"
  secondaryForeground: "#475569"
  success: "#10b981"
  warning: "#f59e0b"
  destructive: "#ef4444"
  ring: "#818cf8"
customCSS: |
  /* Fix root bg-black → white */
  [data-layout-variant] {
    background: #f8f9fa !important;
  }
  /* Disable dark Backdrop layers */
  [data-layout-variant] div.fixed.inset-0.z-\[1\],
  [data-layout-variant] div.fixed.inset-0.z-\[2\],
  [data-layout-variant] div.fixed.inset-0.z-\[101\] {
    display: none !important;
  }
  [data-layout-variant] div.fixed.inset-0.z-\[99\] {
    opacity: 0.06 !important;
  }
  /* Light mobile overlay */
  .fixed.inset-0.z-40:not(#app-sidebar) {
    background: rgba(248, 249, 250, 0.8) !important;
    backdrop-filter: blur(8px) !important;
  }
