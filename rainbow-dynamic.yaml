name: "rainbow-dynamic"
label: "Rainbow Dynamic"
description: "Pure white, gradient sidebar that slowly shifts, each button a different pastel"
palette:
  background: "#ffffff"
  midground: "#334155"
  foreground: "#ffffff"
  warmGlow: "rgba(196, 181, 253, 0.1)"
  noiseOpacity: 0
typography:
  fontSans: "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  fontMono: "ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace"
  baseSize: "17px"
  lineHeight: "1.65"
  letterSpacing: "0"
layout:
  radius: "0.75rem"
  density: comfortable
colorOverrides:
  card: "#ffffff"
  cardForeground: "#334155"
  popover: "#ffffff"
  popoverForeground: "#334155"
  muted: "#f8fafc"
  mutedForeground: "#94a3b8"
  accent: "#f0f9ff"
  accentForeground: "#0284c7"
  border: "#e2e8f0"
  input: "#cbd5e1"
  primary: "#818cf8"
  primaryForeground: "#ffffff"
  secondary: "#fef3c7"
  secondaryForeground: "#b45309"
  success: "#a7f3d0"
  successForeground: "#065f46"
  warning: "#fde68a"
  warningForeground: "#92400e"
  destructive: "#fecaca"
  destructiveForeground: "#991b1b"
  ring: "#a5b4fc"
customCSS: |
  /* ── Sidebar: animated gradient background ── */
  #app-sidebar {
    background: linear-gradient(135deg, #fff5f5 0%, #f5f3ff 15%, #f0fdf4 30%, #fefce8 45%, #fff7ed 60%, #fdf2f8 75%, #f0f9ff 90%, #fff5f5 100%) !important;
    background-size: 400% 400% !important;
    animation: sidebarShift 18s ease-in-out infinite !important;
    border-right: none !important;
  }
  @keyframes sidebarShift {
    0%   { background-position: 0% 50%; }
    25%  { background-position: 50% 0%; }
    50%  { background-position: 100% 50%; }
    75%  { background-position: 50% 100%; }
    100% { background-position: 0% 50%; }
  }

  /* ── Each nav button a different color ── */
  #app-sidebar nav ul li:nth-child(1) a {
    background: #fef2f2 !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(1) a:hover,
  #app-sidebar nav ul li:nth-child(1) a[aria-current="page"] {
    background: #fecaca !important;
  }

  #app-sidebar nav ul li:nth-child(2) a {
    background: #fefce8 !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(2) a:hover,
  #app-sidebar nav ul li:nth-child(2) a[aria-current="page"] {
    background: #fde68a !important;
  }

  #app-sidebar nav ul li:nth-child(3) a {
    background: #f0fdf4 !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(3) a:hover,
  #app-sidebar nav ul li:nth-child(3) a[aria-current="page"] {
    background: #bbf7d0 !important;
  }

  #app-sidebar nav ul li:nth-child(4) a {
    background: #eff6ff !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(4) a:hover,
  #app-sidebar nav ul li:nth-child(4) a[aria-current="page"] {
    background: #bfdbfe !important;
  }

  #app-sidebar nav ul li:nth-child(5) a {
    background: #f5f3ff !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(5) a:hover,
  #app-sidebar nav ul li:nth-child(5) a[aria-current="page"] {
    background: #ddd6fe !important;
  }

  #app-sidebar nav ul li:nth-child(6) a {
    background: #fdf2f8 !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(6) a:hover,
  #app-sidebar nav ul li:nth-child(6) a[aria-current="page"] {
    background: #fbcfe8 !important;
  }

  #app-sidebar nav ul li:nth-child(7) a {
    background: #fff7ed !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(7) a:hover,
  #app-sidebar nav ul li:nth-child(7) a[aria-current="page"] {
    background: #fed7aa !important;
  }

  #app-sidebar nav ul li:nth-child(8) a {
    background: #f0fdfa !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(8) a:hover,
  #app-sidebar nav ul li:nth-child(8) a[aria-current="page"] {
    background: #a7f3d0 !important;
  }

  #app-sidebar nav ul li:nth-child(9) a {
    background: #fefce8 !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(9) a:hover,
  #app-sidebar nav ul li:nth-child(9) a[aria-current="page"] {
    background: #fde68a !important;
  }

  #app-sidebar nav ul li:nth-child(10) a {
    background: #fce7f3 !important;
    border-radius: 0.5rem;
    margin: 0 0.5rem;
  }
  #app-sidebar nav ul li:nth-child(10) a:hover,
  #app-sidebar nav ul li:nth-child(10) a[aria-current="page"] {
    background: #f5b8d0 !important;
  }

  /* ── Sidebar header logo area ── */
  #app-sidebar > div:first-child {
    background: linear-gradient(135deg, #1e1b4b, #312e81) !important;
    border-bottom: 1px solid #6366f1 !important;
  }

  /* ── "Hermes Agent" inverted color + art font ── */
  #app-sidebar > div:first-child .font-bold {
    font-family: 'Georgia', 'Palatino Linotype', 'Book Antiqua', serif !important;
    color: #ffffff !important;
    mix-blend-mode: difference !important;
    font-size: 1.05rem !important;
    letter-spacing: 0.08em !important;
    text-shadow: 0 0 8px rgba(255,255,255,0.3) !important;
  }

  /* ── Sidebar footer ── */
  #app-sidebar > div:last-child {
    border-top: 1px solid #e2e8f0 !important;
  }
layoutVariant: standard
